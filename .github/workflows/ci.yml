name: CI

on:
  # This repository's default branch is master. These read [main] until
  # 2026-08-13, inherited from the textmatelives fork, which meant CI never ran
  # on a single pull request here — only gitleaks (which already used master)
  # reported a check.
  push:
    branches: [master]
    # A CHANGELOG.md-only push to master is a release: release.yml triggers on
    # exactly that path and its verify job already runs this same reusable
    # workflow. Without this, both fire at once for the same commit, run the
    # full suite twice concurrently, and contend -- which is what cancelled the
    # v3.0.0-revived.18 release. Its test job hit the timeout at 15m21s while
    # CI's identical job for the same commit finished in 9m09s.
    #
    # paths-ignore skips only when EVERY changed path matches, so a commit
    # touching CHANGELOG.md alongside code still gets CI.
    paths-ignore:
      - CHANGELOG.md
  pull_request:
    branches: [master]

jobs:
  # Delegates to the reusable workflow, which runs `build` and `test` as two
  # independent jobs. Both must pass for a PR to be viable. The check contexts
  # GitHub reports are `build-and-test / build` and `build-and-test / test`
  # (i.e. <this-job-id> / <reusable-job-id>) — required-status-check names on
  # `main` must be updated to match (the old single `build-test` context is no
  # longer produced).
  build-and-test:
    if: github.repository == 'sdenike/textmate'
    uses: ./.github/workflows/build-and-test.yml
