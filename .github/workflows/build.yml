name: CI

# DISABLED until Phase 2 (Xcode migration) replaces this workflow with xcodebuild.
#
# This builds the inherited 2021 tree, which cannot compile on current toolchains:
# ./configure hardcodes /usr/local/{include,lib} for boost/capnp/sparsehash, while
# Homebrew installs to /opt/homebrew on Apple Silicon AND on current GitHub macOS
# runners. Reproduced on both — see docs/benchmarks/2026-08-12-build-attempt.md.
#
# Left on push, this job is red on every commit until Phase 1 or 2 fixes it. A check
# that is always red is a check people stop reading, which would also erode trust in
# the gitleaks job running beside it. So it is manual-dispatch only for now, not
# deleted: Phase 2 rewrites it, and until then `gh workflow run CI` still works if
# someone wants to confirm the failure first-hand.
#
# Re-enable by restoring `on: [push]` once the build is green. Upstream PR #1457
# addresses the prefix detection, and textmatelives carries fix/configure-homebrew-prefix.
on: [workflow_dispatch]

jobs:
  build:
    if: github.repository == 'sdenike/textmate'
    runs-on: macOS-latest

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Setup
      run: brew install boost capnp google-sparsehash multimarkdown ninja ragel
    - name: Configure
      run: ./configure
    - name: Build
      run: ninja TextMate
