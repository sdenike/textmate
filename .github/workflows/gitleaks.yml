name: gitleaks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # gitleaks/gitleaks-action only scans the commits introduced by a given
    # push or pull request (see its src/index.js), not full history like
    # the previous curl-based step did. This periodic full scan is the
    # replacement for that coverage, catching anything a gitleaks ruleset
    # update finds in history that already passed under older rules.
    - cron: "0 4 * * *" # once a day at 4 AM UTC

permissions:
  contents: read
  # gitleaks-action lists a pull request's commits via the GitHub API to
  # scope its scan (GET .../pulls/{n}/commits, "Pull requests" read
  # permission). PR comments are explicitly disabled below, so no
  # pull-requests: write is granted.
  pull-requests: read

jobs:
  scan:
    # CI runs only on the canonical public repository. Forks and private
    # clones must never run Actions. Update this string when the repo is
    # renamed in Phase 4 — missing it silently disables all CI.
    if: github.repository == 'sdenike/textmate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE: free for a repo owned by a personal GitHub
          # account (sdenike) — only organizations need one. See "Do I need
          # a free license key?" in https://github.com/gitleaks/gitleaks-action.
          # GITLEAKS_VERSION intentionally left unset: the action bumps its
          # bundled gitleaks version on its own releases, and Dependabot
          # tracks the @v3 tag below — that's the fix for the staleness a
          # hand-pinned curl URL had.
          GITLEAKS_ENABLE_COMMENTS: "false"
