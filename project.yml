# XcodeGen spec for TextMate.xcodeproj -- the source of truth for the project.
# Originally emitted by bin/rave2yaml from the .rave build files; both the
# generator and its .rave sources were deleted once parity was proven (Phase 2
# Task 8), so this file is now hand-maintained directly. Regenerate the
# .xcodeproj after editing it: xcodegen generate --spec project.yml
---
name: TextMate
options:
  createIntermediateGroups: true
configFiles:
  Debug: Xcode/Base.xcconfig
  Release: Xcode/Base.xcconfig
settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    GCC_C_LANGUAGE_STANDARD: c99
targets:
  authorization:
    type: library.static
    platform: macOS
    sources:
      - path: "Frameworks/authorization/src/connection.cc"
      - path: "Frameworks/authorization/src/server.cc"
    settings:
      base:
        GCC_PREFIX_HEADER: "$(SRCROOT)/Shared/PCH/prelude.cc"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Xcode/include/io $(SRCROOT)/Xcode/include/text $(SRCROOT)/Xcode/include/cf $(SRCROOT)/Xcode/include/ns $(SRCROOT)/Xcode/include/OakFoundation $(SRCROOT)/Xcode/include/plist $(SRCROOT)/Xcode/include/regexp $(SRCROOT)/Xcode/include/Onigmo $(SRCROOT)/Xcode/include/crash $(SRCROOT)/Xcode/include/OakSystem"
  authorization_test:
    type: tool
    platform: macOS
    sources:
      - path: "$(DERIVED_FILE_DIR)/_Tauthorization.cc"
        optional: true
        buildPhase: sources
    preBuildScripts:
      - script: "\"$SRCROOT/Xcode/scripts/gen_test.sh\" authorization"
        name: "Generate CxxTest runner (authorization)"
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(DERIVED_FILE_DIR)/_Tauthorization.cc"
    settings:
      base:
        GCC_PREFIX_HEADER: "$(SRCROOT)/Shared/PCH/prelude.cc"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Xcode/include/authorization $(SRCROOT)/Xcode/include/io $(SRCROOT)/Xcode/include/text $(SRCROOT)/Xcode/include/cf $(SRCROOT)/Xcode/include/ns $(SRCROOT)/Xcode/include/OakFoundation $(SRCROOT)/Xcode/include/plist $(SRCROOT)/Xcode/include/regexp $(SRCROOT)/Xcode/include/Onigmo $(SRCROOT)/Xcode/include/crash $(SRCROOT)/Xcode/include/OakSystem"
        OTHER_LDFLAGS: "$(inherited) -force_load $(BUILT_PRODUCTS_DIR)/libOnigmo.a"
    dependencies:
      - target: authorization
      - target: io
      - target: text
      - target: cf
      - target: ns
      - target: OakFoundation
      - target: plist
      - target: regexp
      - target: Onigmo
      - target: crash
      - target: OakSystem
      - sdk: Carbon.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: ApplicationServices.framework
      - sdk: Cocoa.framework
      - sdk: Foundation.framework
      - sdk: libiconv.tbd
  io:
    type: library.static
    platform: macOS
    sources:
      - path: "Frameworks/io/src/entries.cc"
        compilerFlags: "-include $(SRCROOT)/Shared/PCH/prelude.cc"
      - path: "Frameworks/io/src/environment.cc"
        compilerFlags: "-include $(SRCROOT)/Shared/PCH/prelude.cc"
      - path: "Frameworks/io/src/events.cc"
        compilerFlags: "-include $(SRCROOT)/Shared/PCH/prelude.cc"
      - path: "Frameworks/io/src/exec.cc"
        compilerFlags: "-include $(SRCROOT)/Shared/PCH/prelude.cc"
      - path: "Frameworks/io/src/move_path.cc"
        compilerFlags: "-include $(SRCROOT)/Shared/PCH/prelude.cc"
      - path: "Frameworks/io/src/path.cc"
        compilerFlags: "-include $(SRCROOT)/Shared/PCH/prelude.cc"
      - path: "Frameworks/io/src/pipe.cc"
        compilerFlags: "-include $(SRCROOT)/Shared/PCH/prelude.cc"
      - path: "Frameworks/io/src/resource.cc"
        compilerFlags: "-include $(SRCROOT)/Shared/PCH/prelude.cc"
      - path: "Frameworks/io/src/intermediate.mm"
        compilerFlags: "-include $(SRCROOT)/Shared/PCH/prelude.mm"
    settings:
      base:
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Xcode/include/text $(SRCROOT)/Xcode/include/cf $(SRCROOT)/Xcode/include/ns $(SRCROOT)/Xcode/include/OakFoundation $(SRCROOT)/Xcode/include/plist $(SRCROOT)/Xcode/include/regexp $(SRCROOT)/Xcode/include/Onigmo $(SRCROOT)/Xcode/include/crash"
  io_test:
    type: tool
    platform: macOS
    sources:
      - path: "$(DERIVED_FILE_DIR)/_Tio.cc"
        optional: true
        buildPhase: sources
    preBuildScripts:
      - script: "\"$SRCROOT/Xcode/scripts/gen_test.sh\" io"
        name: "Generate CxxTest runner (io)"
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(DERIVED_FILE_DIR)/_Tio.cc"
    settings:
      base:
        GCC_PREFIX_HEADER: "$(SRCROOT)/Shared/PCH/prelude.cc"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Xcode/include/io $(SRCROOT)/Xcode/include/text $(SRCROOT)/Xcode/include/cf $(SRCROOT)/Xcode/include/ns $(SRCROOT)/Xcode/include/OakFoundation $(SRCROOT)/Xcode/include/plist $(SRCROOT)/Xcode/include/regexp $(SRCROOT)/Xcode/include/Onigmo $(SRCROOT)/Xcode/include/crash"
        OTHER_LDFLAGS: "$(inherited) -force_load $(BUILT_PRODUCTS_DIR)/libOnigmo.a"
    dependencies:
      - target: io
      - target: text
      - target: cf
      - target: ns
      - target: OakFoundation
      - target: plist
      - target: regexp
      - target: Onigmo
      - target: crash
      - sdk: Carbon.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: ApplicationServices.framework
      - sdk: Cocoa.framework
      - sdk: Foundation.framework
      - sdk: libiconv.tbd
  text:
    type: library.static
    platform: macOS
    sources:
      - path: "Frameworks/text/src/case.cc"
      - path: "Frameworks/text/src/classification.cc"
      - path: "Frameworks/text/src/ctype.cc"
      - path: "Frameworks/text/src/decode.cc"
      - path: "Frameworks/text/src/encode.cc"
      - path: "Frameworks/text/src/format.cc"
      - path: "Frameworks/text/src/indent.cc"
      - path: "Frameworks/text/src/newlines.cc"
      - path: "Frameworks/text/src/parse.cc"
      - path: "Frameworks/text/src/ranker.cc"
      - path: "Frameworks/text/src/trim.cc"
      - path: "Frameworks/text/src/types.cc"
    settings:
      base:
        GCC_PREFIX_HEADER: "$(SRCROOT)/Shared/PCH/prelude.cc"
  text_test:
    type: tool
    platform: macOS
    sources:
      - path: "$(DERIVED_FILE_DIR)/_Ttext.cc"
        optional: true
        buildPhase: sources
    preBuildScripts:
      - script: "\"$SRCROOT/Xcode/scripts/gen_test.sh\" text"
        name: "Generate CxxTest runner (text)"
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(DERIVED_FILE_DIR)/_Ttext.cc"
    settings:
      base:
        GCC_PREFIX_HEADER: "$(SRCROOT)/Shared/PCH/prelude.cc"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Xcode/include/text"
    dependencies:
      - target: text
      - sdk: CoreFoundation.framework
      - sdk: libiconv.tbd
  cf:
    type: library.static
    platform: macOS
    sources:
      - path: "Frameworks/cf/src/cf.cc"
      - path: "Frameworks/cf/src/run_loop.cc"
    settings:
      base:
        GCC_PREFIX_HEADER: "$(SRCROOT)/Shared/PCH/prelude.cc"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Xcode/include/text"
  cf_test:
    type: tool
    platform: macOS
    sources:
      - path: "$(DERIVED_FILE_DIR)/_Tcf.cc"
        optional: true
        buildPhase: sources
    preBuildScripts:
      - script: "\"$SRCROOT/Xcode/scripts/gen_test.sh\" cf"
        name: "Generate CxxTest runner (cf)"
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(DERIVED_FILE_DIR)/_Tcf.cc"
    settings:
      base:
        GCC_PREFIX_HEADER: "$(SRCROOT)/Shared/PCH/prelude.cc"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Xcode/include/cf $(SRCROOT)/Xcode/include/text"
    dependencies:
      - target: cf
      - target: text
      - sdk: CoreFoundation.framework
      - sdk: ApplicationServices.framework
      - sdk: libiconv.tbd
  # ns: cxx_tests declares 1 file but bin/rave has no consumer for target[:cxx_tests] outside its own glob-expand step (bin/rave:137) -- the ninja build never compiles or runs them. Deliberately NOT translated: doing so would add tests the current build never ran, a behaviour change, not parity.
  ns:
    type: library.static
    platform: macOS
    sources:
      - path: "Frameworks/ns/src/event.mm"
      - path: "Frameworks/ns/src/ns.mm"
      - path: "Frameworks/ns/src/spellcheck.mm"
      - path: "Frameworks/ns/src/to_dictionary.mm"
    settings:
      base:
        GCC_PREFIX_HEADER: "$(SRCROOT)/Shared/PCH/prelude.mm"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Xcode/include/text $(SRCROOT)/Xcode/include/OakFoundation $(SRCROOT)/Xcode/include/plist $(SRCROOT)/Xcode/include/cf $(SRCROOT)/Xcode/include/io $(SRCROOT)/Xcode/include/regexp $(SRCROOT)/Xcode/include/Onigmo $(SRCROOT)/Xcode/include/crash"
  ns_test:
    type: tool
    platform: macOS
    sources:
      - path: "$(DERIVED_FILE_DIR)/_Tns.mm"
