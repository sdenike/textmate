      - path: "Frameworks/plist/src/ascii.cc"
        compilerFlags: "-include $(SRCROOT)/Shared/PCH/prelude.cc"
    settings:
      base:
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Xcode/include/text $(SRCROOT)/Xcode/include/cf $(SRCROOT)/Xcode/include/io $(SRCROOT)/Xcode/include/ns $(SRCROOT)/Xcode/include/OakFoundation $(SRCROOT)/Xcode/include/regexp $(SRCROOT)/Xcode/include/Onigmo $(SRCROOT)/Xcode/include/crash"
  plist_test:
    type: tool
    platform: macOS
    sources:
      - path: "$(DERIVED_FILE_DIR)/_Tplist.cc"
        optional: true
        buildPhase: sources
    preBuildScripts:
      - script: "\"$SRCROOT/Xcode/scripts/gen_test.sh\" plist"
