        GCC_PREFIX_HEADER: "$(SRCROOT)/Shared/PCH/prelude.cc"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Xcode/include/plist $(SRCROOT)/Xcode/include/text $(SRCROOT)/Xcode/include/cf $(SRCROOT)/Xcode/include/io $(SRCROOT)/Xcode/include/ns $(SRCROOT)/Xcode/include/OakFoundation $(SRCROOT)/Xcode/include/regexp $(SRCROOT)/Xcode/include/Onigmo $(SRCROOT)/Xcode/include/crash"
        OTHER_LDFLAGS: "$(inherited) -force_load $(BUILT_PRODUCTS_DIR)/libOnigmo.a"
    dependencies:
      - target: plist
      - target: text
      - target: cf
      - target: io
      - target: ns
      - target: OakFoundation
      - target: regexp
      - target: Onigmo
      - target: crash
      - sdk: CoreFoundation.framework
      - sdk: Foundation.framework
      - sdk: ApplicationServices.framework
      - sdk: Carbon.framework
      - sdk: Security.framework
      - sdk: Cocoa.framework
      - sdk: libiconv.tbd
  regexp:
    type: library.static
    platform: macOS
    sources:
