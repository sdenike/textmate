  QuickLookExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: "Applications/QuickLookExtension/src/QuickLookPreviewProvider.h"
      - path: "Applications/QuickLookExtension/src/QuickLookPreviewProvider.mm"
        compilerFlags: "-include $(SRCROOT)/Shared/PCH/prelude.mm"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shelbydenike.TextMate.QuickLookExtension
        INFOPLIST_FILE: "Applications/QuickLookExtension/Info.plist"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Xcode/include/OakFoundation $(SRCROOT)/Xcode/include/text $(SRCROOT)/Xcode/include/buffer $(SRCROOT)/Xcode/include/bundles $(SRCROOT)/Xcode/include/OakSystem $(SRCROOT)/Xcode/include/cf $(SRCROOT)/Xcode/include/io $(SRCROOT)/Xcode/include/ns $(SRCROOT)/Xcode/include/plist $(SRCROOT)/Xcode/include/regexp $(SRCROOT)/Xcode/include/Onigmo $(SRCROOT)/Xcode/include/crash $(SRCROOT)/Xcode/include/scope $(SRCROOT)/Xcode/include/parse $(SRCROOT)/Xcode/include/file $(SRCROOT)/Xcode/include/authorization $(SRCROOT)/Xcode/include/command $(SRCROOT)/Xcode/include/OakAppKit $(SRCROOT)/Xcode/include/settings $(SRCROOT)/Xcode/include/theme $(SRCROOT)/Xcode/include/selection $(SRCROOT)/Xcode/include/encoding $(SRCROOT)/Xcode/include/scm $(SRCROOT)/Xcode/include/xdiff"
        OTHER_LDFLAGS: "$(inherited) -force_load $(BUILT_PRODUCTS_DIR)/libOnigmo.a"
    # The sandbox is NOT optional here, despite the host app being unsandboxed
    # and this fork shipping Developer ID rather than App Store. Measured on
    # macOS 26.6.1: with the sandbox removed the extension does not register at
    # all — `pluginkit -m -i com.shelbydenike.TextMate.QuickLookExtension`
    # returns no matches even after a forced `lsregister -f`. It has to stay.
    #
    # So everything the previewer reads has to be granted explicitly. It needs
    # three things, and a sandboxed extension reaches none of them by default:
    #
    #   ~/Library/Application Support/TextMate/       grammars, Global.tmProperties
    #   ~/Library/Caches/com.shelbydenike.TextMate/   the bundle index
    #   the com.shelbydenike.TextMate defaults domain, for the selected theme
    #
    # Miss any one and create_attributed_string returns nil, and the provider
    # falls back to unstyled plain text. That fallback still renders a perfectly
    # readable preview, so the failure is SILENT — the first attempt granted only
    # the first and third of these and looked like it had worked.
    entitlements:
      path: "Xcode/generated/QuickLookExtension.entitlements"
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.get-task-allow: false
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          # "/" is the home directory itself, read-only. Two subpaths are not
          # enough: path::passwd_entry() validates the home directory with
          # access(pw_dir, R_OK) before returning it, and that check fails when
          # only children are granted -- which used to spin the extension at 100%
          # CPU forever (see the retry bound in Frameworks/io/src/path.cc).
          #
          # Read-only, and a preview extension is asked to render files from
          # anywhere the user can select anyway, so this is not a widening of
          # what it can actually see.
          - "/"
          - "/Library/Application Support/TextMate/"
          - "/Library/Caches/com.shelbydenike.TextMate/"
        com.apple.security.temporary-exception.shared-preference.read-only:
          - "com.shelbydenike.TextMate"
    dependencies:
      - target: OakFoundation
        link: true
      - target: text
        link: true
      - target: buffer
        link: true
      - target: bundles
        link: true
      - target: OakSystem
        link: true
      - target: cf
        link: true
      - target: io
        link: true
      - target: ns
        link: true
      - target: plist
        link: true
