    sources:
      - path: "Frameworks/plist/src/date.cc"
        compilerFlags: "-include $(SRCROOT)/Shared/PCH/prelude.cc"
      - path: "Frameworks/plist/src/delta.cc"
        compilerFlags: "-include $(SRCROOT)/Shared/PCH/prelude.cc"
      - path: "Frameworks/plist/src/plist.cc"
        compilerFlags: "-include $(SRCROOT)/Shared/PCH/prelude.cc"
      - path: "Frameworks/plist/src/to_s.cc"
