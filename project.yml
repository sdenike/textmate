        link: true
      - target: settings
        link: true
      - target: theme
        link: true
      - target: selection
        link: true
      - target: encoding
        link: true
      - target: scm
        link: true
      - target: xdiff
        link: true
      - sdk: CoreFoundation.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: AppKit.framework
      - sdk: OSAKit.framework
