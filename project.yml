      - path: "Frameworks/OakFoundation/src/OakHistoryList.mm"
      - path: "Frameworks/OakFoundation/src/OakStringListTransformer.mm"
    settings:
      base:
        GCC_PREFIX_HEADER: "$(SRCROOT)/Shared/PCH/prelude.mm"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Xcode/include/text"
  plist:
    type: library.static
